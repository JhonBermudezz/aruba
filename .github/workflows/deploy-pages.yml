name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/festive-brown-o5031u, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for the project site (https://<owner>.github.io/<repo>/)
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          export SITE_URL="https://${OWNER}.github.io/${{ github.event.repository.name }}"
          export BASE_PATH="/${{ github.event.repository.name }}/"
          export STAGING=1
          export ASTRO_TELEMETRY_DISABLED=1
          npm run build:gh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
